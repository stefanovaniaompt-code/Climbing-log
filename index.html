  <meta http-equiv="refresh" content="0; url=https://climbing-coach.stefanovania-ompt.chatgpt.site/">
  <title>Climbing Coach</title>
  <link rel="canonical" href="https://climbing-coach.stefanovania-ompt.chatgpt.site/">

<body>
  <p>Climbing Coach si è trasferito. <a href="https://climbing-coach.stefanovania-ompt.chatgpt.site/">Apri l’app</a>.</p>
  <script>
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
        }
      } finally {
        window.location.replace("https://climbing-coach.stefanovania-ompt.chatgpt.site/");
      }
    })();
  </script>
</body>
